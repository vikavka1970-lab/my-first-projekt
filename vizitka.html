<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Виктория Полтавченко</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0a;
      color: #fff;
      font-family: 'Segoe UI', Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    /* Animated background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(120,60,220,0.15) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 20%, rgba(0,180,160,0.1) 0%, transparent 60%),
        radial-gradient(ellipse at 60% 80%, rgba(180,60,120,0.1) 0%, transparent 60%);
      animation: bgShift 8s ease-in-out infinite alternate;
      z-index: 0;
    }

    @keyframes bgShift {
      0%   { opacity: 0.6; }
      100% { opacity: 1; }
    }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 480px;
      margin: 40px 20px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 28px;
      padding: 48px 36px 40px;
      text-align: center;
      backdrop-filter: blur(20px);
      box-shadow: 0 0 60px rgba(120,60,220,0.15), 0 20px 60px rgba(0,0,0,0.5);
      animation: cardIn 0.8s cubic-bezier(0.22,1,0.36,1) both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(30px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Avatar */
    .avatar {
      width: 160px;
      height: 200px;
      border-radius: 16px;
      margin: 0 auto 24px;
      background: linear-gradient(135deg, #7c3aed, #06b6d4, #ec4899);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.4rem;
      font-weight: 700;
      color: #fff;
      box-shadow: 0 0 30px rgba(124,58,237,0.5);
      animation: avatarGlow 3s ease-in-out infinite alternate;
      overflow: hidden;
      padding: 0;
    }
    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 50% 15%;
    }

    @keyframes avatarGlow {
      from { box-shadow: 0 0 20px rgba(124,58,237,0.4); }
      to   { box-shadow: 0 0 40px rgba(6,182,212,0.6); }
    }

    /* Name */
    .name {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(90deg, #a78bfa, #38bdf8, #f472b6);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shimmer 4s linear infinite;
      margin-bottom: 10px;
    }

    @keyframes shimmer {
      0%   { background-position: 0% center; }
      100% { background-position: 200% center; }
    }

    /* Divider */
    .divider {
      width: 60px;
      height: 2px;
      background: linear-gradient(90deg, #7c3aed, #06b6d4);
      border-radius: 2px;
      margin: 16px auto;
    }

    /* Role */
    .role {
      font-size: 0.95rem;
      color: rgba(255,255,255,0.6);
      line-height: 1.6;
      max-width: 320px;
      margin: 0 auto 8px;
    }

    .role strong {
      color: #a78bfa;
      font-weight: 600;
    }

    /* Badge */
    .badge {
      display: inline-block;
      margin-top: 12px;
      padding: 5px 14px;
      background: rgba(124,58,237,0.2);
      border: 1px solid rgba(167,139,250,0.3);
      border-radius: 20px;
      font-size: 0.78rem;
      color: #c4b5fd;
      letter-spacing: 0.5px;
    }

    /* Social icons */
    .socials {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin: 28px 0;
    }

    .social-link {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s;
      position: relative;
      overflow: hidden;
    }

    .social-link::before {
      content: '';
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .social-link:hover { transform: translateY(-4px) scale(1.08); }
    .social-link:hover::before { opacity: 1; }

    .social-link.telegram {
      background: rgba(41,182,246,0.15);
      border: 1px solid rgba(41,182,246,0.3);
    }
    .social-link.telegram:hover {
      box-shadow: 0 8px 24px rgba(41,182,246,0.35);
    }

    .social-link.whatsapp {
      background: rgba(37,211,102,0.15);
      border: 1px solid rgba(37,211,102,0.3);
    }
    .social-link.whatsapp:hover {
      box-shadow: 0 8px 24px rgba(37,211,102,0.35);
    }

    .social-link.phone {
      background: rgba(167,139,250,0.15);
      border: 1px solid rgba(167,139,250,0.3);
    }
    .social-link.phone:hover {
      box-shadow: 0 8px 24px rgba(167,139,250,0.35);
    }

    .social-link svg {
      width: 24px;
      height: 24px;
      position: relative;
      z-index: 1;
    }

    /* CTA Button */
    .cta {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 16px 36px;
      background: linear-gradient(135deg, #7c3aed, #6d28d9);
      color: #fff;
      text-decoration: none;
      border-radius: 16px;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.3px;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 20px rgba(124,58,237,0.4);
      position: relative;
      overflow: hidden;
      margin-bottom: 24px;
    }

    .cta::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.1), transparent);
      opacity: 0;
      transition: opacity 0.2s;
    }

    .cta:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 8px 30px rgba(124,58,237,0.55);
    }

    .cta:hover::after { opacity: 1; }

    .cta svg {
      width: 20px;
      height: 20px;
      animation: ctaArrow 1.5s ease-in-out infinite;
    }

    @keyframes ctaArrow {
      0%, 100% { transform: translateX(0); }
      50%       { transform: translateX(4px); }
    }

    /* Info block */
    .info-block {
      border-top: 1px solid rgba(255,255,255,0.07);
      padding-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .info-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.85rem;
      color: rgba(255,255,255,0.5);
      justify-content: center;
    }

    .info-item svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      color: #a78bfa;
    }

    /* Particles */
    .particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .particle {
      position: absolute;
      width: 2px;
      height: 2px;
      background: rgba(167,139,250,0.6);
      border-radius: 50%;
      animation: float linear infinite;
    }

    @keyframes float {
      0%   { transform: translateY(100vh) scale(0); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { transform: translateY(-10vh) scale(1); opacity: 0; }
    }
  </style>
</head>
<body>

<div class="particles" id="particles"></div>

</div>

<script>
  // Generate floating particles
  const container = document.getElementById('particles');
  for (let i = 0; i < 25; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random() * 100 + 'vw';
    p.style.animationDuration = (8 + Math.random() * 12) + 's';
    p.style.animationDelay = (Math.random() * 10) + 's';
    p.style.width = p.style.height = (1 + Math.random() * 3) + 'px';
    p.style.opacity = 0.3 + Math.random() * 0.4;
    container.appendChild(p);
  }
</script>
</body>
</html>
